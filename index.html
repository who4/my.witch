<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100b12">
  <title>Little Music Player</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <!-- Falling lyrics and the original SVG sit behind the player. -->
  <div id="rain-layer" aria-hidden="true"></div>

  <main class="stage">
    <section class="music-player" aria-label="Music player">
      <div class="player-hero">
        <div class="album-art" id="album-art" aria-label="Album artwork">
          <span class="art-orbit art-orbit-one"></span>
          <span class="art-orbit art-orbit-two"></span>
          <span class="art-letter" id="art-letter">M</span>
          <button class="art-play" id="art-play" type="button" aria-label="Play">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8c0-.8.9-1.3 1.6-.9l10 6.2a1 1 0 0 1 0 1.7l-10 6.2c-.7.4-1.6-.1-1.6-.9V5.8Z" fill="currentColor"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5A1.5 1.5 0 0 1 8.5 4h1A1.5 1.5 0 0 1 11 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-1A1.5 1.5 0 0 1 7 18.5v-13Zm6 0A1.5 1.5 0 0 1 14.5 4h1A1.5 1.5 0 0 1 17 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5v-13Z" fill="currentColor"/></svg>
          </button>
        </div>

        <div class="hero-details">
          <div class="eyebrow">NOW PLAYING</div>
          <div class="track-heading">
            <div class="track-title" id="track-title">My witch</div>
            <div class="track-artist" id="track-artist">Local file</div>
          </div>

          <div class="transport">
            <button class="control-button" id="previous-button" type="button" aria-label="Previous track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM19 6.4v11.2c0 .8-.9 1.3-1.6.9l-8-5.6a1.1 1.1 0 0 1 0-1.8l8-5.6c.7-.4 1.6.1 1.6.9Z" fill="currentColor"/></svg>
            </button>
            <button class="control-button main-play" id="play-button" type="button" aria-label="Play">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8c0-.8.9-1.3 1.6-.9l10 6.2a1 1 0 0 1 0 1.7l-10 6.2c-.7.4-1.6-.1-1.6-.9V5.8Z" fill="currentColor"/></svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5A1.5 1.5 0 0 1 8.5 4h1A1.5 1.5 0 0 1 11 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-1A1.5 1.5 0 0 1 7 18.5v-13Zm6 0A1.5 1.5 0 0 1 14.5 4h1A1.5 1.5 0 0 1 17 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5v-13Z" fill="currentColor"/></svg>
            </button>
            <button class="control-button" id="next-button" type="button" aria-label="Next track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM5 6.4v11.2c0 .8.9 1.3 1.6.9l8-5.6a1.1 1.1 0 0 0 0-1.8l-8-5.6C5.9 5.1 5 5.6 5 6.4Z" fill="currentColor"/></svg>
            </button>
          </div>

          <div class="timeline">
            <button class="seekbar" id="seekbar" type="button" aria-label="Seek through song" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span class="seek-track"><span class="seek-fill" id="seek-fill"></span></span>
            </button>
            <div class="time-row"><span id="current-time">00:00</span><span id="total-time">--:--</span></div>
          </div>
        </div>
      </div>

      <div class="playlist-heading">
        <span>YOUR PLAYLIST</span>
        <span id="track-count">04 TRACKS</span>
      </div>
      <ol class="playlist" id="playlist" aria-label="Playlist"></ol>

      <div class="player-message" id="player-message" role="status" aria-live="polite">Choose a track to begin.</div>
    </section>
  </main>

  <img class="corner-sticker" src="./sticker.webp" alt="" aria-hidden="true">
  <audio id="audio" preload="metadata"></audio>
</body>
</html>
